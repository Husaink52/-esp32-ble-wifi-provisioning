# =============================================================================
# libs.versions.toml: Gradle version catalog (one place for every version)
#
# Build files reference entries as libs.<alias>, e.g. libs.androidx.core.ktx.
# Versions that must move together are grouped and commented.
# See docs/DESIGN.md §9 for why each library is used.
# =============================================================================

[versions]
# Android Gradle Plugin. Needs Gradle 8.9+ (wrapper pins 8.10.2) and JDK 17+
# (Android Studio's bundled JBR works). AGP 8.7 supports compileSdk 35.
agp = "8.7.3"
# Kotlin and the Compose compiler plugin share this version (Kotlin 2.x).
kotlin = "2.0.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
navigationCompose = "2.8.5"
# The Compose BOM sets consistent versions for all androidx.compose.* artifacts.
composeBom = "2024.12.01"
# Espressif's provisioning library (JitPack tag). lib-2.4.4 requires
# compileSdk 35 because it pulls in CameraX 1.5 for its QR-code scanner, which v1 doesn't use.
espProvisioning = "lib-2.4.4"
# EventBus: the Espressif library posts BLE connection events with it, so we
# need it on our compile classpath to subscribe. Keep in step with the library.
eventbus = "3.3.1"
coroutines = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Extended icon set (Wi-Fi, Bluetooth, visibility...). R8 strips unused icons from release builds.
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
esp-provisioning = { group = "com.github.espressif", name = "esp-idf-provisioning-android", version.ref = "espProvisioning" }
eventbus = { group = "org.greenrobot", name = "eventbus", version.ref = "eventbus" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
