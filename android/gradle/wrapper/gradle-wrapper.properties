# =============================================================================
# gradle-wrapper.properties: which Gradle version ./gradlew downloads and uses
#
# Pinning the version means every machine (and CI) builds with the same Gradle.
# Gradle 8.10.2 is compatible with Android Gradle Plugin 8.7.x (see
# gradle/libs.versions.toml). Upgrade both together, following the AGP
# compatibility table: https://developer.android.com/build/releases/gradle-plugin
# =============================================================================
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip
# Give slow networks 10 s before the download is treated as failed.
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
