# =============================================================================
# gradle.properties: JVM and Android build flags for this project
# =============================================================================

# Memory for the Gradle daemon. Compose + R8 builds need more than the default.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX libraries (required by Compose and by the Espressif library).
android.useAndroidX=true

# Each module's R class holds only its own resources. Faster builds, smaller R classes.
android.nonTransitiveRClass=true

# Kotlin code style used by IDE formatting.
kotlin.code.style=official
